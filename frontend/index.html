<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CufflessAI: an educational prototype that estimates blood pressure from a PPG pulse signal. Not a medical device." />
    <title>CufflessAI</title>
    <script>
      // set the theme before first paint to avoid a flash
      (function () {
        try {
          var t = localStorage.getItem("cuffless-theme");
          var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
